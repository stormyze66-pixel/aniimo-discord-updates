name: Aniimo - Discord Updates

on:
  schedule:
    - cron: "7,37 * * * *"

    workflow_dispatch:
    inputs:
      resend_article_id:
        description: "Identifiant de l'article à renvoyer (facultatif)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: aniimo-updates
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Verifier les actualites Aniimo
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANIIMO_ROLE_ID: ${{ secrets.ANIIMO_ROLE_ID }}
        run: python aniimo.py

      - name: Enregistrer les articles detectes
        run: |
          if [ -f aniimo_seen.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add aniimo_seen.json

            if ! git diff --cached --quiet; then
              git commit -m "Mise a jour des articles Aniimo"
              git push
            fi
          fi
